name: Sonic EXE 2.5 - Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-31"
          sdkmanager "build-tools;31.0.0"
          sdkmanager "ndk;21.4.7075529"
          yes | sdkmanager --licenses || true

      - name: Android environment
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.1.5'

      - name: Haxelib setup
        run: |
          haxelib setup ~/haxelib

      - name: Install exact libraries
        run: |
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-addons 2.10.0
          haxelib install flixel-ui 2.5.0
          haxelib install hscript 2.4.0
          haxelib install linc_luajit

      - name: Set library versions
        run: |
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-addons 2.10.0
          haxelib set flixel-ui 2.5.0
          haxelib set hscript 2.4.0

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup android

      - name: Show versions
        run: |
          haxelib list
          haxelib run lime config

      - name: Fix empty FPS
        run: |
          sed -i 's/fps=""/fps="60"/' Project.xml

      - name: Build Android
        run: |
          haxelib run lime build android -release

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-EXE-2.5-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
